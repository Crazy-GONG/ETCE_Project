[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etce"
version = "0.1.0"
description = "Protocol-constrained ETCE experiment reconstruction"
requires-python = ">=3.11"
dependencies = [
  "joblib",
  "numpy",
  "scikit-learn",
  "torch",
  "xgboost"
]

[tool.setuptools.packages.find]
where = ["src"]
